name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'sbt'

    - name: Setup SBT
      uses: sbt/setup-sbt@v1

    - name: Checkout Eru dependency
      run: |
        cd ..
        if [ ! -d "eru" ]; then
          git clone https://github.com/hakimjonas/eru.git eru || echo "Eru clone failed - may be private"
        fi
      continue-on-error: true

    - name: Run all tests
      run: sbt test

    - name: Build artifacts
      run: sbt package

    - name: Generate documentation
      run: sbt doc

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'sbt'

    - name: Setup SBT
      uses: sbt/setup-sbt@v1

    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Publish to Sonatype
      run: sbt publishSigned
      env:
        PGP_SECRET: ${{ secrets.PGP_SECRET }}
        PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      continue-on-error: true

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ steps.version.outputs.version }}
        body: |
          ## eru-http ${{ steps.version.outputs.version }}

          ### Installation

          ```scala
          libraryDependencies += "net.ghoula" %% "eru-http-core" % "${{ steps.version.outputs.version }}"
          libraryDependencies += "net.ghoula" %% "eru-http-client" % "${{ steps.version.outputs.version }}"
          libraryDependencies += "net.ghoula" %% "eru-http-server" % "${{ steps.version.outputs.version }}"
          ```

          See [RELEASE_NOTES.md](RELEASE_NOTES.md) for full changelog.
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, '-') }}

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: [validate]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'sbt'

    - name: Setup SBT
      uses: sbt/setup-sbt@v1

    - name: Run benchmarks
      run: sbt "bench/jmh:run -i 3 -wi 3 -f1 -t1"
      continue-on-error: true

    - name: Store benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: bench/target/jmh-results/
      continue-on-error: true
