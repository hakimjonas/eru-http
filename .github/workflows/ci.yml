name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['25']
        scala: ['3.8.2']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup Java ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
        cache: 'sbt'

    - name: Setup SBT
      uses: sbt/setup-sbt@v1

    - name: Cache SBT
      uses: actions/cache@v4
      with:
        path: |
          ~/.sbt
          ~/.ivy2/cache
          ~/.coursier/cache
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/**') }}
        restore-keys: |
          ${{ runner.os }}-sbt-

    - name: Compile
      run: sbt compile
      env:
        GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}

    - name: Run tests
      run: sbt test
      env:
        GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}

    - name: Check formatting
      if: runner.os == 'Linux'
      run: sbt scalafmtCheckAll scalafmtSbtCheck
      env:
        GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}

    - name: Generate coverage report
      if: runner.os == 'Linux'
      run: sbt coverage test coverageReport
      env:
        GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
      continue-on-error: true

    - name: Upload coverage to Codecov
      if: runner.os == 'Linux'
      uses: codecov/codecov-action@v4
      with:
        files: ./target/scala-3.8.2/coverage-report/cobertura.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'sbt'

    - name: Setup SBT
      uses: sbt/setup-sbt@v1

    - name: Check formatting
      run: sbt scalafmtCheckAll scalafmtSbtCheck
      env:
        GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}

    - name: Run scalafix
      run: sbt "scalafixAll --check"
      env:
        GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
      continue-on-error: true

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'sbt'

    - name: Setup SBT
      uses: sbt/setup-sbt@v1

    - name: Check for dependency updates
      run: sbt dependencyUpdates
      env:
        GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
      continue-on-error: true

    - name: Check for vulnerabilities
      run: sbt dependencyCheck
      env:
        GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
      continue-on-error: true
