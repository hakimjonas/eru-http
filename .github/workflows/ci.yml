name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['21']
        scala: ['3.7.3']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup Java ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
        cache: 'sbt'

    - name: Cache SBT
      uses: actions/cache@v4
      with:
        path: |
          ~/.sbt
          ~/.ivy2/cache
          ~/.coursier/cache
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/**') }}
        restore-keys: |
          ${{ runner.os }}-sbt-

    - name: Checkout Eru dependency
      run: |
        cd ..
        if [ ! -d "eru" ]; then
          git clone https://github.com/hakimjonas/eru.git eru || echo "Eru clone failed - may be private"
        fi
      shell: bash
      continue-on-error: true

    - name: Compile
      run: sbt +compile
      shell: bash

    - name: Run tests
      run: sbt +test
      shell: bash

    - name: Check formatting
      if: runner.os == 'Linux'
      run: sbt scalafmtCheckAll scalafmtSbtCheck
      shell: bash

    - name: Generate coverage report
      if: runner.os == 'Linux'
      run: sbt coverage test coverageReport
      shell: bash
      continue-on-error: true

    - name: Upload coverage to Codecov
      if: runner.os == 'Linux'
      uses: codecov/codecov-action@v4
      with:
        files: ./target/scala-3.7.3/coverage-report/cobertura.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'sbt'

    - name: Check formatting
      run: sbt scalafmtCheckAll scalafmtSbtCheck
      shell: bash

    - name: Run scalafix
      run: sbt "scalafixAll --check"
      shell: bash
      continue-on-error: true

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'sbt'

    - name: Check for dependency updates
      run: sbt dependencyUpdates
      shell: bash
      continue-on-error: true

    - name: Check for vulnerabilities
      run: sbt dependencyCheck
      shell: bash
      continue-on-error: true
