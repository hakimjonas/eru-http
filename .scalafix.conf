rules = [
  ExplicitResultTypes,
  LeakingImplicitClassVal,
  NoValInForComprehension,
  ProcedureSyntax,
  RemoveUnused,
  DisableSyntax,
  OrganizeImports,
  RedundantSyntax,
]

// These rules apply to ALL code (main and test)
ExplicitResultTypes {
  fetchScala3CompilerArtifactsOnVersionMismatch = true
}

OrganizeImports {
  groupedImports = Keep
  groups = ["*", "re:(javax?|scala)\\.", "net.ghoula.eru"]
  removeUnused = true
  targetDialect = Scala3
}

// These rules apply ONLY to main sources
DisableSyntax {
  noVars = true
  noThrows = true
  noNulls = true
  noReturns = true
  noIsInstanceOf = true
  noFinalVal = true
  noFinalize = true
  noCovariant = true
  noContravariant = true
  noAsInstanceOf = true
}

// For comprehensive testing, we allow vars and throws globally
// as they are necessary for testing laziness and exception handling
DisableSyntax.noVars = false
DisableSyntax.noThrows = false
